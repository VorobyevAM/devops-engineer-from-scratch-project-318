services:
  app:
    build:
      context: .
    image: ${IMAGE_NAME:-bulletin-board}:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-9090}:9090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bulletins
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_SERVER_PORT: "9090"
      STORAGE_LOCAL_BASE_PATH: /app/data/uploads
    volumes:
      - .:/project
      - app-data:/app/data
    working_dir: /project
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bulletins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulletins"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-data:
  postgres-data:
