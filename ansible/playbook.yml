---
- name: Prepare Docker host for bulletin board deployment
  hosts: app_servers
  become: true
  vars_files:
    - group_vars/app_servers.yml
  vars:
    docker_users:
      - "{{ ansible_user }}"
    docker_install_compose_plugin: true
    docker_install_compose: false

  pre_tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts["os_family"] == "Debian"

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - htop
          - python3
          - python3-bcrypt
          - python3-docker
          - python3-passlib
          - python3-pip
          - rsyslog
          - ufw
          - unzip
        state: present
      when: ansible_facts["os_family"] == "Debian"

    - name: Validate monitoring access settings
      ansible.builtin.assert:
        that:
          - monitoring_server_cidr != "0.0.0.0/0"
          - monitoring_server_cidr != "::/0"
          - monitoring_basic_auth_password is defined
          - monitoring_basic_auth_password | length >= 16
        fail_msg: >-
          Set a restricted monitoring_server_cidr and a password of at least
          16 characters in encrypted group_vars/all/vault.yml.
      no_log: true

    - name: Create Nginx runtime directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "{{ item.mode }}"
      loop:
        - path: /var/cache/nginx/bulletin-board
          mode: "0755"
        - path: "{{ letsencrypt_webroot }}/.well-known/acme-challenge"
          mode: "0755"

    - name: Create Nginx configuration directory
      ansible.builtin.file:
        path: /etc/nginx
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure monitoring Basic Auth credentials
      community.general.htpasswd:
        path: "{{ monitoring_basic_auth_file }}"
        name: "{{ monitoring_basic_auth_user }}"
        password: "{{ monitoring_basic_auth_password }}"
        owner: root
        group: www-data
        mode: "0640"
        crypt_scheme: bcrypt
      no_log: true

    - name: Configure JSON serialization for Nginx error logs
      ansible.builtin.template:
        src: rsyslog-nginx-observability.conf.j2
        dest: /etc/rsyslog.d/30-nginx-observability.conf
        mode: "0644"
      notify: Restart rsyslog

    - name: Remove legacy manually managed Nginx configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/conf.d/00-observability-json.conf
        - /etc/nginx/conf.d/10-monitoring-endpoints.conf
        - /etc/nginx/conf.d/bulletin-board-cache.conf
        - /etc/nginx/sites-available/bulletin-board
        - /etc/nginx/sites-enabled/bulletin-board
        - /etc/nginx/sites-enabled/bulletin-board-http.conf
        - /etc/nginx/sites-enabled/bulletin-board-https.conf

    - name: Check issued Let's Encrypt certificate
      ansible.builtin.stat:
        path: "{{ letsencrypt_live_dir }}/fullchain.pem"
      register: letsencrypt_certificate

    - name: Track current TLS availability
      ansible.builtin.set_fact:
        nginx_tls_enabled: "{{ letsencrypt_certificate.stat.exists }}"

  roles:
    - role: geerlingguy.docker
    - role: geerlingguy.nginx
    - role: geerlingguy.certbot
    - role: node_exporter
    - role: nginx_exporter
    - role: promtail

  tasks:
    - name: Check issued Let's Encrypt certificate after Certbot role
      ansible.builtin.stat:
        path: "{{ letsencrypt_live_dir }}/fullchain.pem"
      register: letsencrypt_certificate_after

    - name: Require certificate generated by Certbot role
      ansible.builtin.assert:
        that: letsencrypt_certificate_after.stat.exists
        fail_msg: >-
          Certbot did not issue a certificate. Check that {{ app_domain }}
          resolves to {{ ansible_host }} and TCP port 80 is reachable.

    - name: Enable TLS configuration
      ansible.builtin.set_fact:
        nginx_tls_enabled: true

    - name: Apply Nginx site through reusable role
      ansible.builtin.include_role:
        name: geerlingguy.nginx

    - name: Apply Nginx handlers
      ansible.builtin.meta: flush_handlers

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Verify local Nginx stub_status endpoint
      ansible.builtin.uri:
        url: "{{ nginx_exporter_stub_status_url }}"
        status_code: 200
        return_content: true
      register: nginx_stub_status
      retries: 10
      delay: 2
      until:
        - nginx_stub_status.status == 200
        - "'Active connections:' in nginx_stub_status.content"
      changed_when: false

    - name: Verify Nginx Prometheus Exporter metrics
      ansible.builtin.uri:
        url: "http://{{ nginx_exporter_listen_address }}:{{ nginx_exporter_port }}/metrics"
        status_code: 200
        return_content: true
      register: nginx_exporter_metrics
      retries: 10
      delay: 2
      until:
        - nginx_exporter_metrics.status == 200
        - "'nginx_up 1' in nginx_exporter_metrics.content"
        - "'nginx_connections_active' in nginx_exporter_metrics.content"
        - "'nginx_http_requests_total' in nginx_exporter_metrics.content"
      changed_when: false

    - name: Allow required TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: Allow monitoring server to scrape protected ports
      community.general.ufw:
        rule: allow
        from_ip: "{{ monitoring_server_cidr }}"
        to_port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ monitoring_management_proxy_port }}"
        - "{{ monitoring_node_exporter_proxy_port }}"

    - name: Remove direct public access to application ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        delete: true
      loop: "{{ denied_tcp_ports }}"

    - name: Deny incoming traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing traffic by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    - name: Check Docker Engine
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Check Docker Compose plugin
      ansible.builtin.command: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show installed Docker versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ docker_compose_version.stdout }}"

  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
