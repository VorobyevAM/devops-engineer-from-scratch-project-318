---
- name: Prepare Docker host for bulletin board deployment
  hosts: app_servers
  become: true
  vars_files:
    - group_vars/app_servers.yml
  vars:
    docker_users:
      - "{{ ansible_user }}"
    docker_install_compose_plugin: true
    docker_install_compose: false

  pre_tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - htop
          - certbot
          - nginx
          - python3
          - python3-bcrypt
          - python3-docker
          - python3-passlib
          - python3-pip
          - rsyslog
          - ufw
          - unzip
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: geerlingguy.docker
    - role: node_exporter
    - role: nginx_exporter
    - role: promtail

  tasks:
    - name: Validate monitoring access settings
      ansible.builtin.assert:
        that:
          - monitoring_server_cidr != "0.0.0.0/0"
          - monitoring_server_cidr != "::/0"
          - monitoring_basic_auth_password is defined
          - monitoring_basic_auth_password | length >= 16
        fail_msg: >-
          Set a restricted monitoring_server_cidr and a password of at least
          16 characters in encrypted group_vars/app_servers/vault.yml (the
          same value must be present for the monitoring group).
      no_log: true

    - name: Configure monitoring Basic Auth credentials
      community.general.htpasswd:
        path: "{{ monitoring_basic_auth_file }}"
        name: "{{ monitoring_basic_auth_user }}"
        password: "{{ monitoring_basic_auth_password }}"
        owner: root
        group: www-data
        mode: "0640"
        crypt_scheme: bcrypt
      no_log: true
      notify: Reload nginx

    - name: Configure Nginx JSON access log format
      ansible.builtin.template:
        src: nginx-json-logging.conf.j2
        dest: /etc/nginx/conf.d/00-observability-json.conf
        mode: "0644"
      notify: Reload nginx

    - name: Configure JSON serialization for Nginx error logs
      ansible.builtin.template:
        src: rsyslog-nginx-observability.conf.j2
        dest: /etc/rsyslog.d/30-nginx-observability.conf
        mode: "0644"
      notify: Restart rsyslog

    - name: Configure protected monitoring reverse proxy
      ansible.builtin.template:
        src: nginx-monitoring.conf.j2
        dest: /etc/nginx/conf.d/10-monitoring-endpoints.conf
        mode: "0644"
      notify: Reload nginx

    - name: Create Nginx cache directory
      ansible.builtin.file:
        path: /var/cache/nginx/bulletin-board
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Create static files directory for Nginx
      ansible.builtin.file:
        path: "{{ app_static_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Create Let's Encrypt webroot
      ansible.builtin.file:
        path: "{{ letsencrypt_webroot }}/.well-known/acme-challenge"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Check issued Let's Encrypt certificate
      ansible.builtin.stat:
        path: "{{ letsencrypt_live_dir }}/fullchain.pem"
      register: letsencrypt_certificate

    - name: Track current TLS availability
      ansible.builtin.set_fact:
        nginx_tls_enabled: "{{ letsencrypt_certificate.stat.exists }}"

    - name: Configure Nginx cache storage
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/bulletin-board-cache.conf
        mode: "0644"
        content: |
          proxy_cache_path /var/cache/nginx/bulletin-board
              levels=1:2
              keys_zone=bulletin_board_static:20m
              max_size=256m
              inactive=24h
              use_temp_path=off;
      notify: Reload nginx

    - name: Configure Nginx reverse proxy
      ansible.builtin.template:
        src: nginx-bulletin-board.conf.j2
        dest: /etc/nginx/sites-available/bulletin-board
        mode: "0644"
      notify: Reload nginx

    - name: Enable Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/bulletin-board
        dest: /etc/nginx/sites-enabled/bulletin-board
        state: link
      notify: Reload nginx

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Apply Nginx configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify local Nginx stub_status endpoint
      ansible.builtin.uri:
        url: "{{ nginx_exporter_stub_status_url }}"
        status_code: 200
        return_content: true
      register: nginx_stub_status
      retries: 10
      delay: 2
      until:
        - nginx_stub_status.status == 200
        - "'Active connections:' in nginx_stub_status.content"
      changed_when: false

    - name: Verify Nginx Prometheus Exporter metrics
      ansible.builtin.uri:
        url: "http://{{ nginx_exporter_listen_address }}:{{ nginx_exporter_port }}/metrics"
        status_code: 200
        return_content: true
      register: nginx_exporter_metrics
      retries: 10
      delay: 2
      until:
        - nginx_exporter_metrics.status == 200
        - "'nginx_up 1' in nginx_exporter_metrics.content"
        - "'nginx_connections_active' in nginx_exporter_metrics.content"
        - "'nginx_http_requests_total' in nginx_exporter_metrics.content"
      changed_when: false

    - name: Issue Let's Encrypt certificate
      ansible.builtin.command:
        cmd: >-
          certbot certonly
          --webroot
          --webroot-path {{ letsencrypt_webroot }}
          --domain {{ app_domain }}
          --email {{ certbot_email }}
          --agree-tos
          --non-interactive
          --no-eff-email
      register: certbot_issue
      changed_when: "'Successfully received certificate' in certbot_issue.stdout"
      when: not nginx_tls_enabled

    - name: Check issued Let's Encrypt certificate after Certbot
      ansible.builtin.stat:
        path: "{{ letsencrypt_live_dir }}/fullchain.pem"
      register: letsencrypt_certificate_after

    - name: Enable TLS Nginx configuration
      ansible.builtin.set_fact:
        nginx_tls_enabled: "{{ letsencrypt_certificate_after.stat.exists }}"

    - name: Configure Nginx reverse proxy with TLS
      ansible.builtin.template:
        src: nginx-bulletin-board.conf.j2
        dest: /etc/nginx/sites-available/bulletin-board
        mode: "0644"
      notify: Reload nginx

    - name: Validate TLS Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Apply TLS Nginx configuration
      ansible.builtin.meta: flush_handlers

    - name: Ensure Certbot renewal deploy hook reloads Nginx
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        mode: "0755"
        content: |
          #!/bin/sh
          systemctl reload nginx

    - name: Enable Certbot renewal timer
      ansible.builtin.systemd:
        name: certbot.timer
        enabled: true
        state: started

    - name: Allow required TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: Allow monitoring server to scrape protected ports
      community.general.ufw:
        rule: allow
        from_ip: "{{ monitoring_server_cidr }}"
        to_port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ monitoring_management_proxy_port }}"
        - "{{ monitoring_node_exporter_proxy_port }}"

    - name: Remove direct public access to application ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        delete: true
      loop: "{{ denied_tcp_ports }}"

    - name: Deny incoming traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing traffic by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    - name: Check Docker Engine
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Check Docker Compose plugin
      ansible.builtin.command: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show installed Docker versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ docker_compose_version.stdout }}"

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
