---
- name: Validate Grafana settings and Vault secret
  ansible.builtin.assert:
    that:
      - grafana_admin_password is defined
      - grafana_admin_password | length >= 16
      - grafana_host_bind_address in ['127.0.0.1', '::1']
      - grafana_admin_password != monitoring_basic_auth_password
      - grafana_ntfy_webhook_url is defined
      - grafana_ntfy_webhook_url.startswith('https://ntfy.sh/')
      - grafana_smtp_password is defined
      - grafana_smtp_password | length >= 10
      - grafana_alert_email | length > 3
      - grafana_alert_rules | length >= 6
    fail_msg: >-
      Store a unique Grafana admin password of at least 16 characters in an
      encrypted Ansible Vault. Grafana must remain bound to host loopback.
  no_log: true

- name: Create Grafana provisioning and dashboard directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ grafana_provisioning_dir }}"
    - "{{ grafana_provisioning_dir }}/datasources"
    - "{{ grafana_provisioning_dir }}/dashboards"
    - "{{ grafana_provisioning_dir }}/alerting"
    - "{{ grafana_dashboards_dir }}"

- name: Provision Grafana datasources
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/observability.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ grafana_provisioning_dir }}/dashboards/observability.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Install version-controlled Grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_dashboards_dir }}/"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Provision Grafana contact points
  ansible.builtin.template:
    src: contact-points.yml.j2
    dest: "{{ grafana_provisioning_dir }}/alerting/contact-points.yml"
    # The official image uses uid 472 with root as its primary group.
    owner: "472"
    group: root
    mode: "0640"
  no_log: true
  notify: Restart Grafana

- name: Provision Grafana notification policy
  ansible.builtin.template:
    src: notification-policies.yml.j2
    dest: "{{ grafana_provisioning_dir }}/alerting/notification-policies.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Provision Grafana alert rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: "{{ grafana_provisioning_dir }}/alerting/alert-rules.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Pull pinned Grafana image
  community.docker.docker_image:
    name: "{{ grafana_image }}"
    source: pull

- name: Create persistent Grafana data volume
  community.docker.docker_volume:
    name: "{{ grafana_data_volume }}"
    state: present

- name: Run Grafana container on the monitoring network
  community.docker.docker_container:
    name: "{{ grafana_container_name }}"
    image: "{{ grafana_image }}"
    state: started
    recreate: false
    restart_policy: unless-stopped
    networks:
      - name: "{{ prometheus_network_name }}"
    comparisons:
      networks: strict
    published_ports:
      - "{{ grafana_host_bind_address }}:{{ grafana_host_port }}:{{ grafana_container_port }}"
    volumes:
      - "{{ grafana_data_volume }}:/var/lib/grafana"
      - "{{ grafana_provisioning_dir }}:/etc/grafana/provisioning:ro"
      - "{{ grafana_dashboards_dir }}:/var/lib/grafana/dashboards:ro"
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: "{{ grafana_root_url }}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/application-overview.json
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "{{ grafana_smtp_host }}"
      GF_SMTP_USER: "{{ grafana_smtp_user }}"
      GF_SMTP_PASSWORD: "{{ grafana_smtp_password }}"
      GF_SMTP_FROM_ADDRESS: "{{ grafana_smtp_from_address }}"
      GF_SMTP_FROM_NAME: "{{ grafana_smtp_from_name }}"
      GF_SMTP_SKIP_VERIFY: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
    container_default_behavior: no_defaults
  no_log: true

- name: Configure Nginx reverse proxy for Grafana
  ansible.builtin.template:
    src: nginx-grafana.conf.j2
    dest: /etc/nginx/conf.d/grafana.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload monitoring Nginx

- name: Validate Nginx configuration with Grafana virtual host
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Apply pending Grafana and Nginx changes
  ansible.builtin.meta: flush_handlers

- name: Wait for Grafana readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_host_port }}/api/health"
    status_code: 200
    return_content: true
    timeout: 5
  register: grafana_health
  retries: 24
  delay: 5
  until: grafana_health.status == 200 and grafana_health.json.database == 'ok'

- name: Verify provisioned Grafana datasources
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_host_port }}/api/datasources"
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: grafana_datasources
  no_log: true

- name: Verify Grafana can query the provisioned Loki datasource
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_host_port }}/api/datasources/uid/loki/health"
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: grafana_loki_health
  retries: 12
  delay: 5
  until: grafana_loki_health.status == 200
  no_log: true

- name: Verify provisioned Grafana dashboards
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_host_port }}/api/search?tag=provisioned"
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: grafana_dashboards
  no_log: true

- name: Verify provisioned Grafana alert rules
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_host_port }}/api/v1/provisioning/alert-rules"
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: grafana_provisioned_alert_rules
  no_log: true

- name: Verify provisioned Grafana contact points
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_host_port }}/api/v1/provisioning/contact-points"
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: grafana_contact_points
  no_log: true

- name: Assert Grafana provisioning result
  ansible.builtin.assert:
    that:
      - grafana_datasources.json | map(attribute='uid') | list | sort == ['loki', 'prometheus']
      - grafana_loki_health.json.status == 'OK'
      - grafana_dashboards.json | length == (grafana_expected_dashboard_count | int)
      - grafana_provisioned_alert_rules.json | length == (grafana_alert_rules | length + 1)
      - grafana_contact_points.json | selectattr('name', 'equalto', 'ntfy') | list | length == 1
      - grafana_contact_points.json | selectattr('name', 'equalto', 'email') | list | length == 1
    fail_msg: Grafana did not provision the expected datasources, dashboards, rules, and contact points.

- name: Report healthy Grafana provisioning
  ansible.builtin.debug:
    msg: >-
      Grafana is healthy with {{ grafana_datasources.json | length }} datasources
      {{ grafana_dashboards.json | length }} dashboards, and
      {{ grafana_provisioned_alert_rules.json | length }} alert rules.
