---
grafana_version: "12.4.2"
grafana_image: "grafana/grafana:{{ grafana_version }}"
grafana_container_name: grafana
grafana_data_volume: grafana-data
grafana_base_dir: /opt/grafana
grafana_provisioning_dir: "{{ grafana_base_dir }}/provisioning"
grafana_dashboards_dir: "{{ grafana_base_dir }}/dashboards"
grafana_container_port: 3000
grafana_host_bind_address: 127.0.0.1
grafana_host_port: 3001
grafana_ui_port: 3000
grafana_admin_user: admin
grafana_root_url: "http://127.0.0.1:{{ grafana_ui_port }}"
grafana_ui_allowed_cidrs:
  - 127.0.0.1/32
grafana_prometheus_url: http://prometheus:9090
grafana_loki_url: http://loki:3100
grafana_alert_email: admin@example.com
grafana_smtp_host: smtp.example.com:465
grafana_smtp_user: admin@example.com
grafana_smtp_from_address: admin@example.com
grafana_smtp_from_name: Grafana Alerts
grafana_test_alert_enabled: false
grafana_alert_rules: []
grafana_expected_dashboard_count: 5
