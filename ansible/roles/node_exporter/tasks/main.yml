---
- name: Validate Node Exporter architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in node_exporter_architecture_map
    fail_msg: "Unsupported Node Exporter architecture: {{ ansible_architecture }}"

- name: Select Node Exporter architecture
  ansible.builtin.set_fact:
    node_exporter_arch: "{{ node_exporter_architecture_map[ansible_architecture] }}"

- name: Create Node Exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true

- name: Create Node Exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Node Exporter textfile directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "0750"

- name: Download Node Exporter archive
  ansible.builtin.get_url:
    # URL неизбежно длинный из-за версии и архитектуры в имени release-файла.
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"  # noqa yaml[line-length]
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    checksum: "sha256:{{ node_exporter_checksums[node_exporter_arch] }}"
    mode: "0644"

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: /opt
    remote_src: true
    owner: root
    group: root
    creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
  notify: Restart node exporter

- name: Link Node Exporter binary
  ansible.builtin.file:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link
    owner: root
    group: root
  notify: Restart node exporter

- name: Install Node Exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node exporter

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Apply Node Exporter changes before validation
  ansible.builtin.meta: flush_handlers

- name: Verify Node Exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ node_exporter_listen_address }}:{{ node_exporter_port }}/metrics"
    return_content: true
    status_code: 200
  register: node_exporter_metrics
  retries: 10
  delay: 2
  until:
    - node_exporter_metrics.status == 200
    - "'node_uname_info' in node_exporter_metrics.content"
  changed_when: false
