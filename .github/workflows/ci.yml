name: CI инфраструктуры

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ansible:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Установить Ansible и линтер
        run: pip install ansible-core ansible-lint==26.8.0
      - name: Установить роли и коллекции
        run: make ansible-install
      - name: Проверить Ansible
        run: make test
